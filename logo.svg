<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#241830"/>
      <stop offset="1" stop-color="#0c0a0f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- the record -->
  <circle cx="256" cy="256" r="196" fill="#120f16" stroke="#2b2632" stroke-width="6"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#1f1a26" stroke-width="3"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#1f1a26" stroke-width="3"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#1f1a26" stroke-width="3"/>
  <!-- the cue: a pink arc that starts at 12 o'clock, the next track loaded -->
  <path d="M256 60 A196 196 0 0 1 425.7 158" fill="none" stroke="#ff4f8b" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  <!-- cue point -->
  <circle cx="256" cy="60" r="20" fill="#5ad1ff" filter="url(#glow)"/>
  <!-- label -->
  <circle cx="256" cy="256" r="92" fill="#ff4f8b"/>
  <text x="256" y="276" text-anchor="middle" font-family="Unbounded, Archivo Black, Arial Black, sans-serif" font-weight="800" font-size="58" letter-spacing="2" fill="#0c0a0f">CUE</text>
  <circle cx="256" cy="300" r="6" fill="#0c0a0f"/>
</svg>
